<!DOCTYPE html>
<html>
<head>
    <title>HydroManager | Invoice Creator</title>
    <style>
        :root { --brand-color: #00509d; --accent-color: #0077b6; }
        h1 { font-family: 'Playfair Display', serif; color: var(--brand-color); text-align: center; }
        .inv-badge { background: var(--accent-color); color: #fff; padding: 2px 10px; }
    </style>
</head>
<body>
    <div class="page" id="invoicePage1">
        <h1>COMPANY NAME</h1>
        <div class="tagline-row">
            <div class="tagline-left">
                <div class="main-tagline">Professional Service Solutions | Quality Guaranteed</div>
                <div class="divider"></div>
                <div class="payment-details">
                    <strong>Payment Details</strong><br>
                    Bank: [Your Bank Name]<br>
                    Account: [Your Account Number]<br>
                    Branch: [Branch Name]
                </div>
            </div>
            <div class="tagline-right">
                123 Business Street,<br>
                City, Postal Code<br>
                Country.<br>
                <strong>Contact: +00 000 000 000</strong>
            </div>
        </div>
        <div class="sig-item">
            <div class="sig-stamp" style="border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #aaa;">
                STAMP AREA
            </div>
            <div class="sig-line"></div>
            Authorised Signature
        </div>
    </div>
</body>
</html>
